<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#2563eb);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:30px;
border-radius:15px;
width:350px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:#2563eb;
color:white;
border:none;
}
</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<form method="POST">

<input name="username" placeholder="Username">

<input type="password"
name="password"
placeholder="Password">

<button>Login</button>

</form>

</div>

</body>
</html>
